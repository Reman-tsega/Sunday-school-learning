# Render Blueprint: API + PostgreSQL. The web app is deployed separately on Vercel.
databases:
  - name: eotc-db
    plan: free
    databaseName: eotc_learning

services:
  - type: web
    name: eotc-api
    runtime: node
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    buildCommand: >-
      corepack enable && pnpm install --frozen-lockfile
      && pnpm --filter @eotc/shared build
      && cd apps/api && pnpm prisma generate && pnpm prisma migrate deploy && pnpm build
    startCommand: cd apps/api && node dist/index.js
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: eotc-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Your Vercel URL(s), comma separated, no trailing slash
      - key: CORS_ORIGIN
        sync: false
      # Password reset emails
      - key: WEB_APP_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
